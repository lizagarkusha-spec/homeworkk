r:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:16px;background:linear-gradient(140deg,#fff,#fce4ec);padding:16px;min-height:64px;transition:.15s}.tile:hover{border-color:#ed73a8;transform:translateY(-2px)}.tile.selected{outline:3px solid #ed73a8}.tile.good{background:#e7f5eb;border-color:#70b987}.tile.bad{background:#fff0ed;border-color:#e78473}.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.feedback{padding:14px 16px;border-radius:14px;margin-top:16px;background:#fff0f5;border:1px solid var(--line)}.feedback.good{background:#edf8ef;border-color:#a3d3ad}.feedback.bad{background:#fff2ef;border-color:#e6ad9e}.sentence{font-size:1.17rem;font-weight:650;margin:8px 0 16px}.options{display:grid;gap:10px;max-width:700px}.option{text-align:left;background:white;border:1px solid var(--line);border-radius:15px;padding:13px 16px}.option:hover,.option.picked{border-color:var(--hot);background:#fff0f5}.input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;min-width:min(300px,100%);background:white}.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:#fce4ec;border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:.9rem}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.drop{background:#fff;border:2px dashed #efb3ca;border-radius:17px;padding:14px;min-height:140px}.drop h3{font-size:1rem;margin:0 0 10px}.drop .chip{display:inline-block;margin:3px;cursor:pointer}.orderarea{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:12px;background:white;border:1px dashed var(--line);border-radius:14px;margin:12px 0}.word{background:#fce4ec;border:1px solid var(--line);padding:7px 12px;border-radius:10px;cursor:pointer}.word:hover{background:#f8bbd0}.story{font-size:1.12rem;line-height:2.3}.story input{width:140px;border:0;border-bot </head><body><main class="wrap"><header class="hero"><div class="tag">🌸 Learn · Practise · Shine</div><h1>Pink Quest</h1><span class="pill">Vocabulary & Grammar Challenge</span><p>40 useful expressions · 8 playful levels · one confident you</p></header><div class="toolbar"><span class="small" id="stageLabel">Your quest</span><div class="progress"><i id="bar" style="width:0%"></i></div><span class="small" id="scoreLabel">⭐ 0</span><button class="btn" id="homeBtn">⌂ Levels</button></div><section id="app" class="panel"></section><footer class="footer">Small steps, big progress. 💗 Your progress is saved on this device.</footer></main>
<script>
const vocab=[['lyrics','текст пісні'],['holy','святий'],['related to',"пов'язаний із"],["that's why",'ось чому; саме тому'],['also','також'],['confident','упевнений у собі'],['something in common with','мати щось спільне з кимось'],['to share','ділитися; спільно використовувати'],['to share a flat','жити в одній квартирі з кимось'],['term','семестр'],['to afford','дозволити собі фінансово'],['except','окрім'],['healthcare','охорона здоров’я'],['problem solving','розв’язання проблем'],['important qualities','важливі якості'],['likewise','так само'],['during','під час; протягом'],['stressful','стресовий'],['stress-resistant','стресостійкий'],['loyal','відданий'],['trustworthy','надійний; гідний довіри'],['worthy','гідний'],['offend','ображати'],['offended','ображений'],['mutual','взаємний'],['mutual respect','взаємна повага'],['to rely on','покладатися на'],['to be there for you','підтримувати тебе у складні моменти'],['key qualities','ключові якості'],['to lead','вести; очолювати; керувати'],['to deal with','мати справу з; вирішувати'],['to keep going','продовжувати; не здаватися'],['to keep working','продовжувати працювати'],['however','однак'],['to chat about','спілкуватися про; розмовляти про'],['latest','останній; найновіший'],['to take advantage of','скористатися чимось; використати у своїх інтересах'],['shared interests','спільні інтереси'],['as well','також'],['to pay attention to','звертати увагу на']];
const titles=['Memory Match','Word Detective','Sort It Out!','Present Simple or Present Continuous?','Grammar Emergency Room','Build the Sentence','Flatmate Story','Choose the Best Response'];
let saved=JSON.parse(localStorage.getItem('pinkquest')||'{}');let state={level:-1,q:0,score:saved.score||0,done:saved.done||[],errors:saved.errors||[],selected:[],matched:[],roundWords:[],bank:[],sortPlaced:{},storyVals:[],order:[],answer:null,feedback:null,hint:false};const app=document.querySelector('#app');
function persist(){localStorage.setItem('pinkquest',JSON.stringify({score:state.score,done:state.done,errors:state.errors}))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setHead(){document.querySelector('#stageLabel').textContent=state.level<0?'Your quest':`Level ${state.level+1} of 8 · ${titles[state.level]}`;document.querySelector('#bar').style.width=state.level<0?'0%':`${(state.level+1)/8*100}%`;document.querySelector('#scoreLabel').textContent=`⭐ ${state.score}`}
function header(n,title,desc){return `<div class="levelhead"><span class="levelnum">LEVEL ${n}</span><h2>${title}</h2></div><img class="level-art" src="assets/level-${n}-${['memory-match','word-detective','sort-it-out','tenses','grammar-emergency','build-sentence','flatmate-story','best-response'][n-1]}.png" alt="Illustration for level ${n}: ${title}"><p class="instruction">${desc}</p>`}function feedback(){if(!state.feedback)return '';return `<div class="feedback ${state.feedback.ok?'good':'bad'}"><b>${state.feedback.ok?'Lovely! ✓':'Not quite yet.'}</b> ${state.feedback.text}${state.feedback.extra?`<div class="hint">${state.feedback.extra}</div>`:''}</div>`}
function nav(nextLabel='Continue'){return `<div class="stepnav"><button class="btn" onclick="prev()">← Back</button><span class="small">${state.q+1} / ${countForLevel()}</span><button class="btn primary" onclick="next()" ${!state.feedback?'disabled':''}>${nextLabel} →</button></div>`}function countForLevel(){return [5,12,1,10,8,8,14,8][state.level]||1}
function home(){state.level=-1;state.feedback=null;setHead();app.innerHTML=`<div class="levelhead"><span class="levelnum">YOUR QUEST</span><h2>Choose a level</h2></div><p class="instruction">Work through the levels in order. Your tricky words return for another try. Every expression in the word bank gets checked.</p><img class="quest-art" src="assets/pink-quest-illustration.png" alt="Pink Quest illustrated map showing the vocabulary and grammar challenge levels"><p class="art-note">Your illustrated quest map 🌸</p><div class="homegrid">${titles.map((t,i)=>`<button class="levelcard ${state.done.includes(i)?'done':''}" onclick="start(${i})"><b>LEVEL ${i+1} ${state.done.includes(i)?'✓ COMPLETED':''}</b><strong>${t}</strong><span>${['Match 40 words in five mini rounds','Fill in the expression that fits','Sort every expression into a category','Choose the correct tense','Fix each grammar emergency','Put words in natural order','Fill the shared flatmate story','Choose the most appropriate reply'][i]}</span></button>`).join('')}<button class="levelcard" onclick="finalLevel()"><b>👑 FINAL LEVEL</b><strong>Your Life, Your Words</strong><span>Speak or write about someone you admire.</span></button></div><div class="answer"><button class="btn" onclick="resetProgress()">Reset progress</button><span class="score">All 40 expressions · Local progress: ${state.done.length}/8 levels</span></div>`}
function start(i){state.level=i;state.q=0;state.feedback=null;state.answer=null;state.selected=[];state.matched=[];state.sortPlaced={};state.storyVals=[];state.order=[];if(i===0)initMemory();if(i===2)initSort();render();}function initMemory(){let seen=state.roundWords.length?state.roundWords:[];let pool=vocab.filter((_,i)=>!seen.includes(i));if(pool.length<8)pool=vocab.filter((_,i)=>state.errors.includes(i)||!seen.includes(i));let chosen=shuffle(pool.map(x=>vocab.indexOf(x))).slice(0,8);state.roundWords=chosen;state.memoryEng=shuffle(chosen);state.memoryUkr=shuffle(chosen);state.matched=[];state.selected=[]}
function render(){setHead(); if(state.level<0)return home();switch(state.level){case 0:memory();break;case 1:detective();break;case 2:sort();break;case 3:tense();break;case 4:emergency();break;case 5:build();break;case 6:story();break;case 7:response();break;}}
function memory(){let total=state.roundWords.length;app.innerHTML=header(1,'💗 Memory Match','Find each English expression and its Ukrainian meaning. Each mini round has 8 pairs; missed words will return.')+`<div class="small">Round ${Math.floor(state.q/5)+1} of 5 · Pair ${state.matched.length/2+1} of ${total} <span class="pairstat">${state.matched.length/2} matched</span></div><div class="memoryrow" style="margin-top:14px">${state.memoryEng.map(i=>`<button class="tile ${state.matched.includes('e'+i)?'good':''} ${state.selected.includes('e'+i)?'selected':''}" onclick="pickMemory('e${i}')" ${state.matched.includes('e'+i)?'disabled':''}>${vocab[i][0]}</button>`).join('')}${state.memoryUkr.map(i=>`<button class="tile ${state.matched.includes('u'+i)?'good':''} ${state.selected.includes('u'+i)?'selected':''}" onclick="pickMemory('u${i}')" ${state.matched.includes('u'+i)?'disabled':''}>${vocab[i][1]}</button>`).join('')}</div>${feedback()}<div class="stepnav"><button class="btn" onclick="home()">← Levels</button><span class="small">Every expression will be checked at least once.</span><button class="btn primary" onclick="memoryNext()" ${state.matched.length<total*2?'disabled':''}>${state.q>=4?'Finish Level':'Next Round'} →</button></div>`}
function pickMemory(code){if(state.selected.length>=2||state.matched.includes(code))return;state.selected.push(code);if(state.selected.length===2){let [a,b]=state.selected,ai=+a.slice(1),bi=+b.slice(1),ok=a[0]!==b[0]&&ai===bi;state.feedback={ok,text:ok?'A perfect match.':'Here is the pair: '+vocab[ai][0]+' ↔ '+vocab[ai][1]};if(ok){state.matched.push(a,b);state.score+=1;state.errors=state.errors.filter(x=>x!==ai)}else{state.errors.push(ai,bi);setTimeout(()=>{state.selected=[];state.feedback=null;render()},1000)}persist()}render()}
function memoryNext(){if(state.q>=4){finish(0);home();return}state.q++;initMemory();state.feedback=null;render()}
const detect=[['Before singing a song, I like to read the ____.','lyrics','текст пісні',['lyrics','holy','latest']],['My aunt works in ____ and helps people in a local clinic.','healthcare','охорона здоров’я',['healthcare','problem solving','term']],['I can’t ____ a new laptop right now. It’s too expensive.','afford','дозволити собі фінансово',['afford','share','lead']],['All my friends came to the party ____ Mark.','except','окрім Марка',['except','also','likewise']],['This podcast is ____ student life and university experiences.','related to','пов’язаний зі студентським життям',['related to','during','worthy']],['I love this song. I ____ like the lyrics.','also','Я також люблю текст пісні.',['also','except','however']],['I missed the bus. ____, I’m late for class.','That’s why','Ось чому я спізнююся на заняття.',['That’s why','As well','During']],['I have ____ my flatmate: we both love dogs.','something in common with','мати щось спільне з кимось',['something in common with','shared interests','mutual']],['Many people consider this a ____ place and treat it with respect.','holy','святе місце',['holy','latest','worthy']],['I feel more ____ when I practise before a presentation.','confident','упевнений у собі',['confident','offended','loyal']],['Good ____ helps people find solutions to difficult situations.','problem solving','розв’язання проблем',['problem solving','healthcare','important qualities']],['My sister enjoys indie music, and I enjoy it ____.','as well','також',['as well','however','except']]];
function detective(){let d=detect[state.q],opts=shuffle(d[3]);app.innerHTML=header(2,'🌷 Word Detective','Choose the expression that completes the sentence. You’ll see the Ukrainian translation after you answer.')+`<div class="small">Sentence ${state.q+1} of 12</div><p class="sentence">${esc(d[0])}</p><div class="options">${opts.map(o=>`<button class="option ${state.answer===o?'picked':''}" onclick="choose('${esc(o)}')">${esc(o)}</button>`).join('')}</div>${feedback()}${nav()}`}
function choose(o){if(state.feedback)return;state.answer=o;let d=detect[state.q],ok=o.toLowerCase()===d[1].toLowerCase();state.feedback={ok,text:ok?'Correct! '+d[2]:`Hint: ${d[2]}. Try to remember the expression before checking.`,extra:ok?'':`Answer: ${d[1]} · ${d[2]}`};if(ok)state.score++;persist();render()}
const cats=[['Friendship, feelings & qualities',[19,20,21,5,23,22,24,25,26,27,14,28,37,6,18]],['Study, work & everyday life',[7,8,9,10,12,13,16,17,29,30,31,32,35,36,39]],['Linking ideas & communication',[2,3,4,15,33,11,34,38]],['Music, culture & other topics',[0,1]]];
function initSort(){let ids=shuffle(Array.from({length:40},(_,i)=>i));state.sortIds=ids;state.sortPlaced={};}
function sort(){app.innerHTML=header(3,'🎀 Sort It Out!','Tap an expression, then tap the category where it belongs. You can move a card again before checking.')+`<div class="bank">${state.sortIds.filter(i=>state.sortPlaced[i]===undefined).map(i=>`<button class="chip" onclick="pickSort(${i})">${vocab[i][0]}</button>`).join('')}</div><div class="columns">${cats.map((c,j)=>`<div class="drop" onclick="putSort(${j})"><h3>${['💗','📚','💬','🎵'][j]} ${c[0]}</h3>${Object.entries(state.sortPlaced).filter(([i,k])=>k===j).map(([i])=>`<span class="chip">${vocab[i][0]}</span>`).join('')}</div>`).join('')}</div>${state.feedback?feedback():''}<div class="answer"><button class="btn primary" onclick="checkSort()" ${Object.keys(state.sortPlaced).length!==40?'disabled':''}>Check all 40</button></div>${nav('Complete Level')}`}
function pickSort(i){state.pick=i;render()}function putSort(j){if(state.pick===undefined)return;state.sortPlaced[state.pick]=j;state.pick=undefined;state.feedback=null;render()}function checkSort(){let bad=Object.entries(state.sortPlaced).filter(([i,j])=>!cats[j][1].includes(+i));if(!bad.length){state.feedback={ok:true,text:'All 40 expressions are in the right category!'};state.score+=40;persist()}else{state.feedback={ok:false,text:`${bad.length} card${bad.length===1?' needs':'s need'} another look. Incorrect cards are listed below; correct them and check again.`,extra:bad.slice(0,12).map(([i])=>vocab[i][0]).join(' · ')+(bad.length>12?' …':'')};bad.forEach(([i])=>delete state.sortPlaced[i]);}render()}
const tenseQ=[['I usually ___ a flat with Mia, but this week I ___ with my aunt.',['share / am staying','am sharing / stay','share / stay'],'share / am staying','Habit vs temporary arrangement.'],['Daniel ___ in healthcare, and today he ___ at a health fair.',['works / is helping','is working / helps','works / helps'],'works / is helping','Job is a fact; today’s help is happening now.'],['We often ___ about our shared interests, but right now we ___ about the latest film.',['chat / are chatting','are chatting / chat','chat / chat'],'chat / are chatting','Often is a habit; right now is current.'],['My brother rarely ___ attention to lyrics.',['pays','is paying','pay'],'pays','Rarely describes a habit.'],['Why ___ offended? I ___ only ___ a question.',['do you look / am asking','are you looking / only ask','do you look / only ask'],'do you look / am asking','Look (meaning seem) is a state verb; asking is in progress.'],['I usually ___ on Sara because she always ___ there for me.',['rely / is','am relying / is being','rely / is being'],'rely / is','Rely and be there describe a regular relationship.'],['This term ___ stressful, and I ___ to keep going.',['is / am trying','is being / try','is / try'],'is / am trying','The term feels stressful; the effort is happening now.'],['Our team usually ___ with problems together, but today our manager ___ the meeting.',['deals / is leading','is dealing / leads','deals / leads'],'deals / is leading','Usually signals habit; today signals current action.'],['He normally ___ after dinner, but this week he ___ on a project at work.',['keeps working / is working','is keeping working / works','keeps working / works'],'keeps working / is working','Normally is routine; this week is temporary.'],['These expressions ___ to healthcare, and I ___ attention to the new ones now.',['are related / am paying','relate / pay','are relating / pay'],'are related / am paying','Related is a state; now calls for present continuous.']];

const storyAnswers=['share','term','stressful','stress-resistant','loyal','trustworthy','rely','be there','chat','latest','shared interests','related to','However','mutual'];const storyOptions=[['share','are sharing','shared'],['term','lyrics','except'],['stressful','holy','mutual'],['stress-resistant','offended','latest'],['loyal','latest','except'],['trustworthy','stressful','holy'],['rely','offend','lead'],['be there','take advantage','pay attention'],['chat','afford','lead'],['latest','mutual','holy'],['shared interests','healthcare','lyrics'],['related to','except','during'],['However','Likewise','Also'],['mutual','holy','stressful']];function story(){let text=`Karina and Olha <input data-i="0" placeholder="1" value="${esc(state.storyVals[0]||'')}" list="opt0"> a flat near the university. This <input data-i="1" placeholder="2" value="${esc(state.storyVals[1]||'')}" list="opt1"> is extremely <input data-i="2" placeholder="3" value="${esc(state.storyVals[2]||'')}" list="opt2"> because they have lots of exams.<br>Olha is very <input data-i="3" placeholder="4" value="${esc(state.storyVals[3]||'')}" list="opt3">: she stays calm during difficult weeks. She is also <input data-i="4" placeholder="5" value="${esc(state.storyVals[4]||'')}" list="opt4"> and <input data-i="5" placeholder="6" value="${esc(state.storyVals[5]||'')}" list="opt5">. Karina can <input data-i="6" placeholder="7" value="${esc(state.storyVals[6]||'')}" list="opt6"> on her because Olha always tries to <input data-i="7" placeholder="8" value="${esc(state.storyVals[7]||'')}" list="opt7"> for Karina.<br>In the evening, they <input data-i="8" placeholder="9" value="${esc(state.storyVals[8]||'')}" list="opt8"> about the <input data-i="9" placeholder="10" value="${esc(state.storyVals[9]||'')}" list="opt9"> films and discover that they have many <input data-i="10" placeholder="11" value="${esc(state.storyVals[10]||'')}" list="opt10">. One film is <input data-i="11" placeholder="12" value="${esc(state.storyVals[11]||'')}" list="opt11"> friendship.<br>Karina prefers comedies, while Olha likes thrillers. <input data-i="12" placeholder="13" value="${esc(state.storyVals[12]||'')}" list="opt12">, they never offend each other because they believe in <input data-i="13" placeholder="14" value="${esc(state.storyVals[13]||'')}" list="opt13"> respect.`;app.innerHTML=header(7,'🏠 Flatmate Story','Fill each gap using an expression from the word bank. Tap a blank and choose or type an answer.')+`<div class="bank">${[...new Set(storyAnswers)].map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="story">${text}</div>${storyAnswers.map((_,i)=>`<datalist id="opt${i}">${storyOptions[i].map(x=>`<option value="${x}">`).join('')}</datalist>`).join('')}<div class="answer"><button class="btn primary" onclick="checkStory()">Check story</button></div>${feedback()}<div class="stepnav"><button class="btn" onclick="prev()">← Back</button><button class="btn primary" onclick="next()" ${!state.feedback?.ok?'disabled':''}>Continue →</button></div>`;app.querySelectorAll('.story input').forEach(el=>el.oninput=()=>state.storyVals[+el.dataset.i]=el.value)}function checkStory(){let good=storyAnswers.every((x,i)=>(state.storyVals[i]||'').trim().toLowerCase()===x.toLowerCase());state.feedback={ok:good,text:good?'Beautifully done! “Stress-resistant” describes someone who stays calm under pressure.':`Review the gaps and try again. Correct order: ${storyAnswers.join(' · ')}`,extra:good?'Olha shares a flat with Karina; the term is stressful. She is stress-resistant, loyal and trustworthy. Karina can rely on her because Olha tries to be there for Karina. They chat about the latest films and their shared interests. One film is related to friendship. However, they believe in mutual respect.':''};if(good){state.score+=14;persist()}render()}
const responses=[['Your friend tells you a secret and you know they will keep it.',['They are offended.','They are trustworthy.','They are stressful.'],'They are trustworthy.'],['You and your roommate both love travelling and horror films.',['You have shared interests.','You can’t afford it.','You are taking advantage of each other.'],'You have shared interests.'],['Someone makes an unpleasant comment and you feel hurt.',['You are confident.','You are offended.','You are stress-resistant.'],'You are offended.'],['Your friend is struggling during exams. You want to support them.',['I can rely on you.','I’ll be there for you.','I’ll take advantage of you.'],'I’ll be there for you.'],['You have a difficult assignment, but you decide not to quit.',['Keep going!','Except!','Holy!'],'Keep going!'],['Your friend uses your kindness for free things and never helps you.',['They show mutual respect.','They are loyal.','They are taking advantage of you.'],'They are taking advantage of you.'],['A new version of an app has just been released.',['The latest version','A stressful version','A mutual version'],'The latest version'],['You want someone to notice the details in a song.',['Rely on the song.','Pay attention to the lyrics.','Keep working the lyrics.'],'Pay attention to the lyrics.']];function response(){let d=responses[state.q];app.innerHTML=header(8,'💌 Choose the Best Response','Read the situation and choose the most appropriate expression.')+`<div class="small">Situation ${state.q+1} of 8</div><p class="sentence">${esc(d[0])}</p><div class="options">${shuffle(d[1]).map(o=>`<button class="option ${state.answer===o?'picked':''}" onclick="responsePick('${esc(o)}')">${esc(o)}</button>`).join('')}</div>${feedback()}${nav('Finish Level')}`}
